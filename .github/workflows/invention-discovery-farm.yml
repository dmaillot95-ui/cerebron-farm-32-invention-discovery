name: CEREBRON Farm 32 Invention Discovery

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {role: PROBLEM_DISCOVERY_SPECIALIST, model: huggingface-projects/llama-3.2-3B-Instruct, focus: unmet needs bottlenecks contradictions}
          - {role: MECHANISM_INVENTOR, model: huggingface-projects/gemma-2-9b-it, focus: physical computational biological mechanisms}
          - {role: CROSS_DOMAIN_TRANSFER_SPECIALIST, model: huggingface-projects/llama-3.2-3B-Instruct, focus: transfer mechanisms across domains}
          - {role: CONTRADICTION_MINER, model: huggingface-projects/gemma-2-9b-it, focus: contradictions anomalies unresolved tradeoffs}
          - {role: BIOMIMICRY_INVENTOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: biological principles translated into engineering}
          - {role: ARCHITECTURE_SYNTHESIS_SPECIALIST, model: huggingface-projects/gemma-2-9b-it, focus: system architectures interfaces modularity}
          - {role: MATERIAL_PROCESS_INVENTOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: materials processes manufacturing concepts}
          - {role: ALGORITHM_INVENTOR, model: huggingface-projects/gemma-2-9b-it, focus: algorithms optimization representations}
          - {role: SYSTEMS_INVENTOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: integrated system inventions}
          - {role: SIMPLIFICATION_ENGINEER, model: huggingface-projects/gemma-2-9b-it, focus: remove complexity preserve capability}
          - {role: FEASIBILITY_AUDITOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: physics engineering resource feasibility}
          - {role: MANUFACTURABILITY_AUDITOR, model: huggingface-projects/gemma-2-9b-it, focus: fabrication supply chain maintainability}
          - {role: VALUE_ECONOMICS_AUDITOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: value cost adoption economic constraints}
          - {role: SAFETY_FAILURE_AUDITOR, model: huggingface-projects/gemma-2-9b-it, focus: hazards failure modes unintended consequences}
          - {role: EXPERIMENT_DESIGNER, model: huggingface-projects/llama-3.2-3B-Instruct, focus: minimum decisive tests falsification}
          - {role: NOVELTY_PRIOR_ART_STYLE_AUDITOR, model: huggingface-projects/gemma-2-9b-it, focus: conceptual novelty collision risks without legal claims}
          - {role: DISCOVERY_HYPOTHESIS_GENERATOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: testable scientific discovery hypotheses}
          - {role: RED_TEAM_INVENTION, model: huggingface-projects/gemma-2-9b-it, focus: destroy weak ideas expose hidden assumptions}
          - {role: INDEPENDENT_REPLICATOR, model: huggingface-projects/llama-3.2-3B-Instruct, focus: independently reproduce reasoning and candidate ranking}
          - {role: OMEGA_INVENTION_DISCOVERY_JUDGE, model: huggingface-projects/gemma-2-9b-it, focus: evidence bounded synthesis unresolved unknowns}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q gradio_client
      - name: Run external model worker
        continue-on-error: true
        env:
          ROLE: ${{ matrix.role }}
          MODEL: ${{ matrix.model }}
          FOCUS: ${{ matrix.focus }}
        run: python worker/agent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm32-${{ matrix.role }}
          path: results/*.json

  omega:
    needs: agents
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: farm32-*
          path: collected
          merge-multiple: true
      - name: Build Omega evidence packet
        run: |
          python - <<'PY'
          import json, glob, os
          rows=[]
          for p in glob.glob('collected/*.json'):
              try:
                  rows.append(json.load(open(p, encoding='utf-8')))
              except Exception as e:
                  rows.append({'file':p,'parse_error':repr(e)})
          packet={
            'farm':32,
            'name':'Invention Discovery',
            'roles_returned':len(rows),
            'successful_external_ai_calls':sum(bool(x.get('inference_success')) for x in rows),
            'model_families':sorted(set(x.get('model','') for x in rows if x.get('model'))),
            'rules':['CLAIM <= EVIDENCE','IDEA != INVENTION','PATENTABILITY != FTO','SIMULATION != TEST','UNKNOWN REMAINS UNKNOWN','VERIFY BEFORE COMMIT'],
            'results':rows
          }
          os.makedirs('omega',exist_ok=True)
          json.dump(packet,open('omega/farm32-omega.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps({k:v for k,v in packet.items() if k!='results'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: invention-discovery-farm-32-omega-packet
          path: omega/farm32-omega.json
